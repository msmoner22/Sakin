<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakin Qur'an</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    header {
      background: #14532d;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: white;
    }

    button {
      cursor: pointer;
    }

    .primary {
      background: #14532d;
      color: white;
      border: none;
    }

    .secondary {
      background: #e8f5e9;
      color: #14532d;
      border: 1px solid #14532d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .juz-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .ayah {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      transition: .2s;
    }

    .ayah.active {
      border: 2px solid #14532d;
      background: #f0f8f2;
    }

    .ayah-number {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .arabic {
      direction: rtl;
      text-align: right;
      font-size: 30px;
      line-height: 2.1;
      margin-bottom: 12px;
    }

    .translation {
      line-height: 1.7;
      font-size: 16px;
    }

    .tafsir {
      background: #fafafa;
      border-left: 4px solid #14532d;
      padding: 12px;
      margin-top: 12px;
      line-height: 1.7;
    }

    .audio-panel {
      position: sticky;
      bottom: 0;
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.08);
      z-index: 10;
    }

    .audio-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .audio-buttons button {
      margin: 0;
      padding: 10px 5px;
    }

    #audioStatus {
      text-align: center;
      font-size: 13px;
      color: #555;
      margin-bottom: 8px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      .juz-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .arabic {
        font-size: 26px;
      }

      .audio-buttons {
        grid-template-columns: repeat(2, 1fr);
      }

    }
  </style>
</head>

<body>

<header>
  <h1>📖 Sakin Qur'an</h1>
  <p>Qur'an Reading • Translation • Tafsir • Audio</p>
</header>

<div class="container">

  <!-- Continue Reading -->

  <div class="card">

    <h2>Continue Reading</h2>

    <button
      class="primary"
      onclick="continueSakinReading()"
    >
      Continue from where I stopped
    </button>

  </div>


  <!-- Surah -->

  <div class="card">

    <h2>Surah</h2>

    <select id="surahSelect">
      <option value="">Select Surah</option>
    </select>

    <button
      class="primary"
      onclick="openSelectedSurah()"
    >
      Open Surah
    </button>

  </div>


  <!-- Juz -->

  <div class="card">

    <h2>30 Juz</h2>

    <div
      id="juzContainer"
      class="juz-grid"
    ></div>

  </div>


  <!-- Arabic Display -->

  <div class="card">

    <h2>Arabic Qur'an Display</h2>

    <select id="arabicStyle">

      <option value="uthmani">
        Uthmani
      </option>

      <option value="indopak">
        Indo-Pak
      </option>

      <option value="naskh">
        Arabic Naskh
      </option>

    </select>

  </div>


  <!-- Translation -->

  <div class="card">

    <h2>Translation</h2>

    <select id="translationLanguage">

      <option value="bn">
        বাংলা
      </option>

      <option value="en">
        English
      </option>

      <option value="ar">
        العربية
      </option>

    </select>

  </div>


  <!-- Tafsir -->

  <div class="card">

    <h2>Tafsir</h2>

    <select id="tafsirSelect">

      <option value="ibn-kathir">
        Tafsir Ibn Kathir
      </option>

      <option value="ruh-al-maani">
        Tafsir Ruh al-Ma'ani
      </option>

      <option value="jalalayn">
        Tafsir al-Jalalayn
      </option>

      <option value="saeedi">
        Tafsir Saeedi
      </option>

      <option value="abu-bakr-zakaria">
        Tafsir Abu Bakr Zakaria
      </option>

      <option value="tafsir-6">
        Tafsir Collection 6
      </option>

      <option value="tafsir-7">
        Tafsir Collection 7
      </option>

      <option value="tafsir-8">
        Tafsir Collection 8
      </option>

      <option value="tafsir-9">
        Tafsir Collection 9
      </option>

      <option value="tafsir-10">
        Tafsir Collection 10
      </option>

    </select>

  </div>


  <!-- Qur'an Reading Area -->

  <div class="card">

    <h2 id="surahTitle">
      Select a Surah
    </h2>

    <div id="quranContent">

      <p>
        Select a Surah to start reading.
      </p>

    </div>

  </div>

</div>


<!-- Audio Player -->

<div class="audio-panel">

  <div id="audioStatus">
    Audio ready
  </div>

  <div class="audio-buttons">

    <button
      onclick="playPreviousSakinAyah()"
    >
      ⏮ Previous
    </button>

    <button
      class="primary"
      onclick="playCurrentSakinAudio()"
    >
      ▶ Play
    </button>

    <button
      onclick="pauseSakinAudio()"
    >
      ⏸ Pause
    </button>

    <button
      onclick="playNextSakinAyah()"
    >
      Next ⏭
    </button>

    <button
      onclick="toggleSakinAudioRepeat()"
    >
      🔁 Repeat
    </button>

  </div>

</div>


<!-- =====================================================
     IMPORTANT:
     Data file loads first.
     Audio file loads after it.
     ===================================================== -->

<script src="./quran-data.js"></script>

<script src="./quran-audio.js"></script>


<script>

  /* =====================================================
     SAKIN QUR'AN PAGE
     ===================================================== */

  let selectedSurah = 0;
  let selectedAyah = 1;


  /* =====================================================
     SURAH LIST
     ===================================================== */

  function loadSurahList(){

    const select =
      document.getElementById(
        "surahSelect"
      );

    if(
      typeof SAKIN_SURAH_NAMES ===
      "undefined"
    ){

      return;

    }

    select.innerHTML =
      '<option value="">Select Surah</option>';

    SAKIN_SURAH_NAMES.forEach(
      function(name, index){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          index + 1;

        option.textContent =
          `${index + 1}. ${name}`;

        select.appendChild(
          option
        );

      }
    );

  }


  /* =====================================================
     JUZ BUTTONS
     ===================================================== */

  function loadJuzList(){

    const container =
      document.getElementById(
        "juzContainer"
      );

    container.innerHTML = "";

    for(
      let i = 1;
      i <= 30;
      i++
    ){

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        "Juz " + i;

      button.onclick =
        function(){

          openJuz(i);

        };

      container.appendChild(
        button
      );

    }

  }


  /* =====================================================
     OPEN SURAH
     ===================================================== */

  function openSelectedSurah(){

    const value =
      document.getElementById(
        "surahSelect"
      ).value;

    if(!value){

      return;

    }

    openSurah(
      Number(value)
    );

  }


  /* =====================================================
     OPEN SURAH
     ===================================================== */

  function openSurah(
    surahNumber
  ){

    selectedSurah =
      Number(surahNumber);

    selectedAyah = 1;

    localStorage.setItem(
      "sakinQuranSurah",
      selectedSurah
    );

    localStorage.setItem(
      "sakinQuranAyah",
      selectedAyah
    );

    const select =
      document.getElementById(
        "surahSelect"
      );

    select.value =
      selectedSurah;

    const title =
      document.getElementById(
        "surahTitle"
      );

    let surahName =
      "Surah " +
      selectedSurah;

    if(
      typeof SAKIN_SURAH_NAMES !==
      "undefined" &&
      SAKIN_SURAH_NAMES[
        selectedSurah - 1
      ]
    ){

      surahName =
        SAKIN_SURAH_NAMES[
          selectedSurah - 1
        ];

    }

    title.textContent =
      `${selectedSurah}. ${surahName}`;

    renderQuranContent();

  }


  /* =====================================================
     OPEN JUZ
     ===================================================== */

  function openJuz(juzNumber){

    localStorage.setItem(
      "sakinQuranJuz",
      juzNumber
    );

    const title =
      document.getElementById(
        "surahTitle"
      );

    title.textContent =
      "Juz " + juzNumber;

    const content =
      document.getElementById(
        "quranContent"
      );

    content.innerHTML = `

      <div class="tafsir">

        Juz ${juzNumber} selected.

        <br><br>

        The verified Qur'an dataset will
        populate the complete Juz reading
        section.

      </div>

    `;

  }


  /* =====================================================
     RENDER QUR'AN
     ===================================================== */

  function renderQuranContent(){

    const content =
      document.getElementById(
        "quranContent"
      );

    content.innerHTML = "";

    /*
      If complete Qur'an data exists,
      it will be rendered here.
    */

    if(
      typeof SAKIN_QURAN_DATA ===
      "undefined"
    ){

      content.innerHTML = `

        <div class="tafsir">

          Qur'an data is ready to be
          connected.

        </div>

      `;

      return;

    }

    const surah =
      SAKIN_QURAN_DATA[
        selectedSurah
      ];

    if(!surah){

      content.innerHTML = `

        <div class="tafsir">

          This Surah's verified Ayah data
          has not been added yet.

        </div>

      `;

      return;

    }

    if(!Array.isArray(surah.ayahs)){

      content.innerHTML = `

        <div class="tafsir">

          Ayah data is not available yet.

        </div>

      `;

      return;

    }

    surah.ayahs.forEach(
      function(ayah){

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "ayah";

        div.dataset.surah =
          selectedSurah;

        div.dataset.ayah =
          ayah.number;

        div.innerHTML = `

          <div class="ayah-number">

            Ayah ${ayah.number}

          </div>

          <div class="arabic">

            ${ayah.arabic || ""}

          </div>

          <div class="translation">

            ${ayah.translation || ""}

          </div>

          ${
            ayah.tafsir
              ? `
                <div class="tafsir">
                  ${ayah.tafsir}
                </div>
              `
              : ""
          }

        `;

        div.onclick =
          function(){

            selectedAyah =
              Number(
                ayah.number
              );

            localStorage.setItem(
              "sakinQuranSurah",
              selectedSurah
            );

            localStorage.setItem(
              "sakinQuranAyah",
              selectedAyah
            );

            if(
              typeof setSakinAudioPosition ===
              "function"
            ){

              setSakinAudioPosition(
                selectedSurah,
                selectedAyah
              );

            }

          };

        content.appendChild(
          div
        );

      }
    );

  }


  /* =====================================================
     CONTINUE READING
     ===================================================== */

  function continueSakinReading(){

    const savedSurah =
      localStorage.getItem(
        "sakinQuranSurah"
      );

    const savedAyah =
      localStorage.getItem(
        "sakinQuranAyah"
      );

    if(savedSurah){

      selectedSurah =
        Number(savedSurah);

      selectedAyah =
        Number(
          savedAyah || 1
        );

      openSurah(
        selectedSurah
      );

      setTimeout(
        function(){

          highlightSakinAyah(
            selectedSurah,
            selectedAyah
          );

        },
        300
      );

    }else{

      alert(
        "No saved reading position yet."
      );

    }

  }


  /* =====================================================
     SAVE POSITION
     ===================================================== */

  function saveSakinQuranAudioPosition(
    surah,
    ayah
  ){

    localStorage.setItem(
      "sakinQuranSurah",
      surah
    );

    localStorage.setItem(
      "sakinQuranAyah",
      ayah
    );

  }


  /* =====================================================
     GET POSITION
     ===================================================== */

  function getSakinQuranAudioPosition(){

    const surah =
      localStorage.getItem(
        "sakinQuranSurah"
      );

    const ayah =
      localStorage.getItem(
        "sakinQuranAyah"
      );

    if(!surah){

      return null;

    }

    return {

      surah:
        Number(surah),

      ayah:
        Number(ayah || 1)

    };

  }


  /* =====================================================
     INITIALIZE PAGE
     ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      loadSurahList();

      loadJuzList();

      const savedSurah =
        localStorage.getItem(
          "sakinQuranSurah"
        );

      if(savedSurah){

        openSurah(
          Number(savedSurah)
        );

      }

    }
  );

</script>
<script src="./quran-config.js"></script>
</body>
</html>
